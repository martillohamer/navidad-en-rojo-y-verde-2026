name: CI - Navidad en Rojo y Verde 2026

on:
  push:
    branches: [ main, feat/* ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'maven'

    - name: Run Tests (Main Profile)
      run: mvn clean test

    - name: Run Tests (Soluciones Profile)
      run: mvn -Psoluciones clean test

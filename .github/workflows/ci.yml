name: CI Navidad Roja y Verde

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main, feat/* ]

jobs:
  validar-soluciones:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Comprobar estructura (esqueletos y soluciones emparejados)
        run: bash scripts/comprobar-estructura
      - name: Validar soluciones en verde
        run: mvn -Psoluciones test

  progreso:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Ejecutar tests (modo reto, en rojo)
        run: mvn test -Dmaven.test.failure.ignore=true || true
      - name: Mostrar progreso
        run: ./scripts/progreso
